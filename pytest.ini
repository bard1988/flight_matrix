[pytest]
testpaths = tests
# `backend` is on the path so tests import the modules the app imports (`import board`,
# not `import backend.board`), which is how run.py sets things up too. `tests` is on it so
# conftest helpers can be imported by name.
pythonpath = backend tests
addopts = -q --strict-markers
filterwarnings =
    # httpx deprecated verify=<str>; config.CA_BUNDLE is a path by design, because this
    # machine needs certifi's roots merged with a corporate CA in one file.
    ignore:`verify=<str>` is deprecated:DeprecationWarning
