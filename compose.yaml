# Containerised FlightMatrix + Caddy (TLS + a shared-password gate the app itself lacks).
#
#   cp .env.example .env      # fill TRAVELPAYOUTS_TOKEN
#   export FLIGHTMATRIX_DOMAIN=flightmatrix.example.org
#   export FLIGHTMATRIX_BASIC_USER=team
#   export FLIGHTMATRIX_BASIC_HASH="$(docker run --rm caddy caddy hash-password --plaintext 'choose-a-password')"
#   docker compose up -d --build
#
# ONE app container only. Never scale `flightmatrix` past 1 — see Dockerfile.

services:
  flightmatrix:
    build: .
    restart: unless-stopped
    expose:
      - "8712"
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FLIGHTMATRIX_DOMAIN: ${FLIGHTMATRIX_DOMAIN:?set FLIGHTMATRIX_DOMAIN}
      FLIGHTMATRIX_BASIC_USER: ${FLIGHTMATRIX_BASIC_USER:?set FLIGHTMATRIX_BASIC_USER}
      FLIGHTMATRIX_BASIC_HASH: ${FLIGHTMATRIX_BASIC_HASH:?set FLIGHTMATRIX_BASIC_HASH}
      FLIGHTMATRIX_UPSTREAM: flightmatrix:8712
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - flightmatrix

volumes:
  caddy_data:
  caddy_config:
