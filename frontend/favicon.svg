<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="FlightMatrix">
  <!-- The board in miniature: a 3x3 of fare cells running the ramp cheapest to dearest,
       with the cheapest carrying the reserved yellow marker. Same tokens as styles.css. -->
  <rect width="32" height="32" rx="7" fill="#0b0b0b"/>
  <g>
    <rect x="6"  y="6"  width="6" height="6" rx="1.5" fill="#12603d"/>
    <rect x="13" y="6"  width="6" height="6" rx="1.5" fill="#278d41"/>
    <rect x="20" y="6"  width="6" height="6" rx="1.5" fill="#bb7c24"/>
    <rect x="6"  y="13" width="6" height="6" rx="1.5" fill="#19773f"/>
    <rect x="13" y="13" width="6" height="6" rx="1.5" fill="#bb7c24"/>
    <rect x="20" y="13" width="6" height="6" rx="1.5" fill="#e0875c"/>
    <rect x="6"  y="20" width="6" height="6" rx="1.5" fill="#278d41"/>
    <rect x="13" y="20" width="6" height="6" rx="1.5" fill="#e0875c"/>
    <rect x="20" y="20" width="6" height="6" rx="1.5" fill="#fbb7b4"/>
  </g>
  <rect x="4.75" y="4.75" width="8.5" height="8.5" rx="2.25" fill="none" stroke="#f2b705" stroke-width="1.5"/>
</svg>
